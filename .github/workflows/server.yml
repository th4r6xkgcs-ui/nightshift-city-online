name: Server checks
on:
  push:
    paths: ['server/**', 'shared/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'shared/**', '.github/workflows/server.yml']
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: server
