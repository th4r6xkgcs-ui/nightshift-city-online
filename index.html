const c=document.querySelector('#game'),g=c.getContext('2d');let W,H,scale=1;function resize(){W=c.width=innerWidth;H=c.height=innerHeight;g.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const world={w:2200,h:1700},player={x:460,y:450,hp:100,cash:750,ammo:30,angle:0,car:null,heat:0},keys={},bullets=[],peds=[],cars=[],buildings=[],loot=[];let camera={x:0,y:0},aimJoy=null;let ticks=0,lastSave=0,joy={x:0,y:0},firing=false,run=false,message='',msgUntil=0;
const saved=(()=>{try{return JSON.parse(localStorage.getItem('nightshift-city-save-v2')||'null')}catch{return null}})();if(saved){for(const [k,min,max] of [['cash',0,100000000],['hp',0,100],['x',10,world.w-10],['y',10,world.h-10],['ammo',0,30]])if(Number.isFinite(saved[k]))player[k]=Math.max(min,Math.min(max,saved[k]));}const save=()=>{globalThis.NightshiftInventory?.save();try{localStorage.setItem('nightshift-city-save-v2',JSON.stringify({cash:player.cash,hp:player.hp,x:player.x,y:player.y,ammo:player.ammo,reserve:combatState?.reserve??90}))}catch{}};addEventListener('pagehide',save);const combatState=NightshiftCombat.create(Number.isFinite(saved?.reserve)?saved.reserve:90);const rand=(a,b)=>a+Math.random()*(b-a);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function say(s){message=s;msgUntil=performance.now()+2500;const t=document.querySelector('#toast');t.textContent=s;t.style.opacity=1}function interact(){if(globalThis.NightshiftInventory?.paused())return;if(globalThis.NightshiftRecovery?.paused())return;if(player.car&&globalThis.NightshiftInventory&&keys.g){globalThis.NightshiftInventory.open('glove');return}if(globalThis.NightshiftHome?.use())return;if(globalThis.NightshiftHome?.paused())return;if(player.car){const v=player.car;if(Math.abs(v.speed)>1){say('Stop the car before exiting');return}const spots=[Math.PI/2,-Math.PI/2,Math.PI,0].map(a=>({x:v.x+Math.cos(v.angle+a)*48,y:v.y+Math.sin(v.angle+a)*48}));const spot=spots.find(p=>p.x>10&&p.y>10&&p.x<world.w-10&&p.y<world.h-10&&!blocked(p.x,p.y)&&!cars.some(c=>c!==v&&distance(c,p)<38));if(!spot){say('No safe space to exit');return}Object.assign(player,spot);v.owner=false;player.car=null;say('Exited vehicle');return}const car=cars.find(v=>distance(v,player)<65);if(car){player.car=car;car.owner=true;say('Vehicle entered — drive with joystick / WASD');return}const b=buildings.find(v=>distance({x:v.x+v.w/2,y:v.y+v.h+12},player)<90);if(b){if(b.name==='CORNER SHOP'){globalThis.NightshiftRecovery.openShop()}else if(b.name==='GARAGE')say('Garage preview: upgrades coming soon');else if(b.name==='BANK')say('Bank services planned for multiplayer');else say(b.name+' — interior coming soon');return}const item=loot.find(v=>distance(v,player)<35);if(item){player.cash+=item.value;loot.splice(loot.indexOf(item),1);say('Collected $'+item.value);return}say('Nothing nearby to interact with')}
function reload(){if(globalThis.NightshiftInventory?.paused())return;if(globalThis.NightshiftRecovery?.paused())return;if(globalThis.NightshiftHome?.paused())return;if(player.car)return;if(NightshiftCombat.begin(combatState,player.ammo,performance.now()))say('Reloading…');else say('Magazine full, already reloading, or no spare ammo')}function fire(){if(globalThis.NightshiftInventory&&!(NightshiftInventory.state.pocket.pistol>0)){say('No carried pistol · buy one at the corner shop');return;}if(globalThis.NightshiftInventory?.paused())return;if(globalThis.NightshiftRecovery?.paused())return;if(globalThis.NightshiftHome?.paused())return;if(player.car){say('Exit vehicle before firing');return}if(!NightshiftCombat.canFire(combatState,player.ammo,performance.now())){say(combatState.until?'Reloading…':'Out of ammo — press R to reload');return}player.ammo--;const a=player.angle;bullets.push({x:player.x+Math.cos(a)*18,y:player.y+Math.sin(a)*18,vx:Math.cos(a)*10,vy:Math.sin(a)*10,life:45});player.heat=Math.min(5,player.heat+.08)}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(!e.repeat&&e.key.toLowerCase()==='e')interact();if(!e.repeat&&e.key.toLowerCase()==='g'&&player.car)globalThis.NightshiftInventory?.open('glove');if(!e.repeat&&e.key.toLowerCase()==='r')reload();if(e.key===' ')firing=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key===' ')firing=false});
let aim={x:W/2+120,y:H/2};c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){aimJoy=null;aim={x:e.clientX,y:e.clientY}}});c.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')fire()});
const pad=document.querySelector('#pad'),nub=document.querySelector('#nub');function movePad(e){const r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.max(1,Math.hypot(x,y));joy={x:clamp(x/50,-1,1),y:clamp(y/50,-1,1)};if(d>50){joy.x=x/d;joy.y=y/d}nub.style.left=(39+joy.x*39)+'px';nub.style.top=(39+joy.y*39)+'px'}pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);movePad(e)});pad.addEventListener('pointermove',e=>{if(e.buttons)movePad(e)});function resetPad(){joy={x:0,y:0};nub.style.left='39px';nub.style.top='39px'}pad.addEventListener('pointerup',resetPad);pad.addEventListener('pointercancel',resetPad);

const ap=document.querySelector('#aimPad'),an=document.querySelector('#aimNub');function aimTouch(e){const r=ap.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y);if(d>8){aimJoy=Math.atan2(y,x);player.angle=aimJoy}an.style.transform=`translate(${x/Math.max(1,d)*Math.min(36,d)}px,${y/Math.max(1,d)*Math.min(36,d)}px)`}ap.onpointerdown=e=>{ap.setPointerCapture(e.pointerId);aimTouch(e)};ap.onpointermove=e=>{if(ap.hasPointerCapture(e.pointerId))aimTouch(e)};for(const ev of ['pointerup','pointercancel'])ap.addEventListener(ev,()=>an.style.transform='');addEventListener('blur',()=>{for(const k in keys)keys[k]=false;firing=false;run=false;resetPad()});let nextShot=0;
function blocked(x,y){return buildings.some(b=>x>b.x-9&&x<b.x+b.w+9&&y>b.y-9&&y<b.y+b.h+9)}function road(){g.fillStyle='#20383a';g.fillRect(0,0,world.w,world.h);for(let x=0;x<world.w;x+=440){g.fillStyle='#2b303c';g.fillRect(x-65,0,130,world.h);g.fillStyle='#e8d078';for(let y=10;y<world.h;y+=48)g.fillRect(x-2,y,4,23)}for(let y=0;y<world.h;y+=340){g.fillStyle='#2b303c';g.fillRect(0,y-62,world.w,124);g.fillStyle='#e8d078';for(let x=12;x<world.w;x+=52)g.fillRect(x,y-2,26,4)}for(let x=0;x<world.w;x+=440)for(let y=0;y<world.h;y+=340){g.fillStyle='#bdc2b077';for(let k=-40;k<=40;k+=16){g.fillRect(x-63,y+k,126,5);g.fillRect(x+k,y-63,5,126)}}}

function drawCar(v){g.save();g.translate(v.x,v.y);g.rotate(v.angle);g.fillStyle='#101722';g.fillRect(-28,-17,56,34);g.fillStyle=v.color;g.fillRect(-25,-15,50,30);g.fillStyle='#7fa6b6';g.fillRect(-5,-12,16,24);g.fillStyle='#d8ecf6';g.fillRect(20,-12,5,8);g.fillRect(20,4,5,8);g.fillStyle='#f6b2a2';g.fillRect(-27,-11,4,7);g.fillRect(-27,4,4,7);g.restore()}
function drawPerson(p,isPlayer=false){g.save();g.translate(p.x,p.y);g.fillStyle='#11192588';g.beginPath();g.ellipse(0,9,13,6,0,0,Math.PI*2);g.fill();g.fillStyle=isPlayer?(globalThis.NightshiftHome?.profile.shirt||'#54d7e4'):p.color;g.fillRect(-8,-9,16,18);g.fillStyle=isPlayer?(globalThis.NightshiftHome?.profile.skin||'#d5a27b'):'#d5a27b';g.fillRect(-5,-16,10,9);if(isPlayer){g.fillStyle=globalThis.NightshiftHome?.profile.hair||'#25212b';g.fillRect(-6,-19,12,5)}g.fillStyle='#1b2030';g.fillRect(-7,9,5,7);g.fillRect(3,9,5,7);if(isPlayer){g.rotate(player.angle);g.fillStyle='#e5ebf4';g.fillRect(5,-3,18,5)}g.restore()}
let last=performance.now();function frame(now){if(globalThis.NightshiftInventory?.paused()){last=now;requestAnimationFrame(frame);return;}globalThis.NightshiftRecovery?.tick(now);if(globalThis.NightshiftRecovery?.paused()){last=now;requestAnimationFrame(frame);return;}if(globalThis.NightshiftHome?.paused()){last=now;globalThis.NightshiftHome.render(now);requestAnimationFrame(frame);return;}const dt=Math.min(2,(now-last)/16.67);last=now;ticks+=dt;player.ammo=NightshiftCombat.finish(combatState,player.ammo,now);let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;const mag=Math.hypot(mx,my);if(mag>1){mx/=mag;my/=mag}if(player.car){const v=player.car;const thrust=-my;v.speed=clamp(v.speed+thrust*.22*dt,-2.6,7);v.speed*=Math.pow(.984,dt);v.angle+=mx*.038*dt*(v.speed>=0?1:-1);const nx=clamp(v.x+Math.cos(v.angle)*v.speed*dt,32,world.w-32),ny=clamp(v.y+Math.sin(v.angle)*v.speed*dt,32,world.h-32);const corners=[[-28,-18],[-28,18],[28,-18],[28,18]];const collision=corners.some(([x,y])=>blocked(nx+x*Math.cos(v.angle)-y*Math.sin(v.angle),ny+x*Math.sin(v.angle)+y*Math.cos(v.angle)))||cars.some(c=>c!==v&&Math.hypot(c.x-nx,c.y-ny)<50);if(collision){const impact=Math.abs(v.speed);v.speed*=-.2;if(impact>4)globalThis.NightshiftRecovery?.damage(Math.round(impact*2),now);}else{v.x=nx;v.y=ny;}player.x=v.x;player.y=v.y}else{const speed=(keys.shift||run?5:3)*dt;const nx=clamp(player.x+mx*speed,10,world.w-10),ny=clamp(player.y+my*speed,10,world.h-10);if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny;if(aimJoy!==null)player.angle=aimJoy;else player.angle=Math.atan2(aim.y+camera.y-player.y,aim.x+camera.x-player.x)}if(firing&&now>=nextShot&&!player.car){fire();nextShot=now+180}for(const p of peds){p.t-=dt;if(p.t<=0){p.dx=rand(-1,1);p.dy=rand(-1,1);p.t=rand(30,110)}const px=clamp(p.x+p.dx*.38*dt,10,world.w-10),py=clamp(p.y+p.dy*.38*dt,10,world.h-10);if(!blocked(px,p.y))p.x=px;else p.dx*=-1;if(!blocked(p.x,py))p.y=py;else p.dy*=-1}for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(blocked(b.x,b.y)){bullets.splice(i,1);continue}const hit=peds.find(p=>distance(p,b)<16);if(hit){hit.hp-=20;bullets.splice(i,1);if(hit.hp<=0){loot.push({x:hit.x,y:hit.y,value:Math.floor(rand(15,80))});peds.splice(peds.indexOf(hit),1);player.heat=Math.min(5,player.heat+.5)}continue}if(b.life<=0)bullets.splice(i,1)}player.heat=Math.max(0,player.heat-.0007*dt);if(now-lastSave>10000){save();lastSave=now}g.clearRect(0,0,W,H);g.fillStyle='#0a1321';g.fillRect(0,0,W,H);const camX=clamp(player.x-W/2,0,Math.max(0,world.w-W)),camY=clamp(player.y-H/2,0,Math.max(0,world.h-H));camera={x:camX,y:camY};g.save();g.translate(-camX,-camY);road();buildings.forEach(building);for(const d of globalThis.NightshiftInventory?.drops||[]){if(d.expires>Date.now()){g.fillStyle='#f9be68';g.fillRect(d.x-10,d.y-8,20,16);g.fillStyle='#242538';g.font='10px monospace';g.fillText('BAG',d.x,d.y-14)}}loot.forEach(l=>{g.fillStyle='#ffd55c';g.fillRect(l.x-6,l.y-6,12,12)});cars.forEach(drawCar);peds.forEach(p=>drawPerson(p));if(!player.car)drawPerson(player,true);g.fillStyle='#ffe99b';for(const b of bullets){g.beginPath();g.arc(b.x,b.y,3,0,Math.PI*2);g.fill()}g.restore();g.save();const mw=112,mh=86,mx0=W-mw-14,my0=65;g.fillStyle='#0c1529e8';g.fillRect(mx0-4,my0-4,mw+8,mh+8);g.strokeStyle='#8097b0';g.strokeRect(mx0-4,my0-4,mw+8,mh+8);g.fillStyle='#394254';for(let x=0;x<world.w;x+=440)g.fillRect(mx0+x/world.w*mw-3,my0,6,mh);for(let y=0;y<world.h;y+=340)g.fillRect(mx0,my0+y/world.h*mh-3,mw,6);g.fillStyle='#61e1ec';g.beginPath();g.arc(mx0+player.x/world.w*mw,my0+player.y/world.h*mh,3,0,Math.PI*2);g.fill();g.restore();document.querySelector('#hud').innerHTML=`<b>🌃 NIGHTSHIFT CITY ONLINE</b><br>❤️ ${Math.round(player.hp)} HP &nbsp; 💵 $${player.cash}<br>🔫 ${player.ammo}/30 +${combatState.reserve}${combatState.until?' ⏳':''} &nbsp; 🚨 Heat ${player.heat.toFixed(1)}<br>${player.car?'🚘 Driving · '+Math.abs(player.car.speed*15|0)+' mph':'🚶 On foot'}<br>NPCs: ${peds.length} · Local sandbox`;if(now>msgUntil)document.querySelector('#toast').style.opacity=0;requestAnimationFrame(frame)}if(blocked(player.x,player.y)){player.x=460;player.y=450}for(const p of peds)if(blocked(p.x,p.y))p.x=440;requestAnimationFrame(frame);
